# Automat Częstokocham (darmowy): co 30 minut sprawdza panel, o 10, 12 i 15 (czas polski) pobiera aktualności
# z czestochowa.pl i wczestochowie.pl, po każdej zmianie kodu publikuje od razu, co 2 godziny (7–21) uruchamia wirtualnego redaktora (szkice do akceptu) i odświeża kalendarz wydarzeń z cgk.czestochowa.pl, buduje stronę i wdraża ją na Firebase Hosting (plan Spark).
name: Publikacja

on:
  schedule:
    # poza pełnymi i wpół godzinami – wtedy GitHub najczęściej gubi uruchomienia; zapas: panel i scripts/budzik.gs
    - cron: '7,37 4-21 * * *' # 6:07–23:37 w Polsce
  # zmiana kodu strony lub panelu – od razu nowy build (commity automatu nie uruchamiają workflow)
  push:
    branches: [main]
    paths-ignore: ['public/media/**', 'data/**', 'README.md']
  workflow_dispatch:
    inputs:
      mode:
        description: 'build, import, redaktor albo auto (jak harmonogram: tylko gdy coś czeka)'
        default: build

concurrency:
  group: publikacja
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/check.mjs
            lib/firestore.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock firebase-admin@14.5.0
      - id: c
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        run: node scripts/check.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  publish:
    needs: check
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'auto') || needs.check.outputs.run != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      # zawsze najnowszy main – uruchomienie czekające w kolejce nie może wdrożyć strony bez zdjęć zapisanych przez poprzednie
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Klucz konta serwisowego
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Import, build i wdrożenie
        run: node scripts/publish.mjs ${{ (needs.check.outputs.run == 'import' || inputs.mode == 'import') && '--import' || '' }} ${{ (needs.check.outputs.run == 'redaktor' || inputs.mode == 'redaktor') && '--redaktor' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ADMIN_EMAILS: skubiszewskik@gmail.com,czestokocham@gmail.com
      - name: Zapis nowych zdjęć i kopii artykułów w repozytorium
        run: |
          git config user.name "Automat Częstokocham"
          git config user.email "actions@users.noreply.github.com"
          git add public/media data
          git diff --cached --quiet || git commit -m "Publikacja $(date -u +%F\ %H:%M) UTC"
          # przy zderzeniu z inną publikacją wygrywa nasza, nowsza kopia danych; kilka prób, gdy ktoś wypchnął w międzyczasie
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
      - name: Porządki w bazie (dopiero gdy zdjęcia są już w repozytorium)
        run: node scripts/finish.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
